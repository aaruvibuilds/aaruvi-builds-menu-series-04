<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09080b">
  <title>AARUVI BUILDS - Expanding Circle Menu</title>

</head>
<body>

  <main class="page">

    <div class="menu-wrap" id="menuWrap">
      <div class="circle" aria-hidden="true"></div>

      <nav class="menu-items" aria-label="Main navigation">
        <a href="#" class="menu-item item-1"><span>01</span>HOME</a>
        <a href="#" class="menu-item item-2"><span>02</span>WORK</a>
        <a href="#" class="menu-item item-3"><span>03</span>ABOUT</a>
        <a href="#" class="menu-item item-4"><span>04</span>CONTACT</a>
      </nav>

      <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
      >
        <span class="menu-label">MENU</span>
        <span class="menu-icon" aria-hidden="true">
          <i></i>
          <i></i>
        </span>
      </button>
    </div>
  </main>

  <script src="script.js"></script>

</html>
